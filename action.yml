name: 'Telegram Pull Request updates'
description: 'Sends a message to a Telegram channel when a pull request is updated'
author: 'Another1DD'
inputs:
  chat_id:
    required: true
    description: 'Telegram chat ID'
  topic_id:
    required: false
    description: 'Telegram topic ID'
  bot_token:
    required: true
    description: 'Telegram bot token'
  github_token:
    required: false
    default: ${{ github.token }}
    description: 'Reads a review''s inline comments, so a review is sent as one message. Without access each comment is sent on its own.'
branding:
  icon: 'send'
  color: 'gray-dark'
runs:
  using: 'node24'
  main: 'dist/index.js'
